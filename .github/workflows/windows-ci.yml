name: Windows CI

on:
  push:
    branches: [ main, "work/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore LUMA.sln
      - name: Build
        run: dotnet build LUMA.sln --configuration Release --no-restore
      - name: Test core
        run: dotnet test tests/Luma.Core.Tests/Luma.Core.Tests.csproj --configuration Release --no-restore
      - name: Package Windows preview
        shell: pwsh
        run: |
          $output = "src/Luma.App/bin/Release/net10.0-windows10.0.19041.0"
          if (!(Test-Path "$output/Luma.App.exe")) {
            Get-ChildItem -Path $output -Force | Select-Object Name, Length | Format-Table -AutoSize
            throw "Luma.App.exe was not found in the build output."
          }
          $archive = "LUMA-OS-preview-${{ github.sha }}.zip"
          Compress-Archive -Path "$output/*" -DestinationPath $archive -CompressionLevel Optimal
          Get-Item $archive | Select-Object Name, Length | Format-Table -AutoSize
      - name: Upload Windows preview ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LUMA-OS-Windows-Preview
          path: LUMA-OS-preview-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
