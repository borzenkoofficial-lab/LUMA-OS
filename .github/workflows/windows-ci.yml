name: Windows CI

on:
  push:
    branches: [ main, "work/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore LUMA.sln
      - name: Build
        run: dotnet build LUMA.sln --configuration Release --no-restore
      - name: Test core
        run: dotnet test tests/Luma.Core.Tests/Luma.Core.Tests.csproj --configuration Release --no-restore
